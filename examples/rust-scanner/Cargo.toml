[package]
name = "scanner"
version = "0.1.0"
edition = "2021"

# The scenario harness is the `examples/veridoc.rs` example target, so Cargo discovers it without an
# `[[example]]` section and veridoc builds it with `cargo build --release --example veridoc`. The
# claim library is a dev-dependency because only that target and the claim modules it links need it.
[dev-dependencies]
veridoc-claims = { path = "../../crates/veridoc-claims" }

# Its own workspace root: the plugin builds this example with its own target directory, and the
# plugin repository must not become its workspace.
[workspace]
