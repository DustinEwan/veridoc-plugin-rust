[workspace]
resolver = "2"
members = ["crates/plugin-rust"]
# The example projects are separate crates: veridoc builds them, and the plugin must not be
# rebuilt when an author builds their own project.
exclude = ["examples/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[workspace.dependencies]
plugin-rpc = "0.1.0-alpha.11"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"

[profile.release]
overflow-checks = true
