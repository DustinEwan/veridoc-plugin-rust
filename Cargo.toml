[workspace]
resolver = "2"
members = ["crates/plugin-rust"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[workspace.dependencies]
plugin-rpc = "0.1.0-alpha.11"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

thiserror = "2.0.21"

[profile.release]
overflow-checks = true
